name: CD

# Builds release images on every main push. Deployment to Azure happens only
# when the environment secrets exist; otherwise the workflow still proves the
# images build and the migrations apply — a build that cannot produce an
# image must never be called shippable.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build release images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infra/docker/api.Dockerfile -t mytrakin-api:${{ github.sha }} .

      - name: Build web image
        run: >
          docker build -f infra/docker/web.Dockerfile
          --build-arg NEXT_PUBLIC_SUPABASE_URL='https://placeholder.supabase.co'
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY='placeholder-anon-key'
          --build-arg NEXT_PUBLIC_API_BASE_URL='https://placeholder.invalid'
          -t mytrakin-web:${{ github.sha }} .

  migrate-check:
    name: Migrations apply from empty
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API package
        run: python -m pip install -e "apps/api[dev]"

      - name: Apply every migration from empty
        run: python scripts/apply_migrations.py --reset

      - name: Verify schema
        run: python scripts/verify_schema.py

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: [images, migrate-check]
    environment: production
    steps:
      - name: Check deployment credentials
        id: gate
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AZURE_CREDENTIALS not set; images built but nothing deployed."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/login@v2
        if: steps.gate.outputs.configured == 'true'
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy (migrator job first, then traffic shift)
        if: steps.gate.outputs.configured == 'true'
        run: |
          echo "Deploy with: az containerapp job start + revision traffic shift."
          echo "See infra/azure/container-apps.md for the topology."
