[project]
name = "mytrakin-api"
version = "0.1.0"
description = "MyTrakin platform API — FastAPI, RBAC, RLS-aware data access, AI gateway"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "redis>=5.2",
  "celery[redis]>=5.4",
  "httpx>=0.27",
  "structlog>=24.4",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43.0",
  "argon2-cffi>=23.1",
  "sentry-sdk[fastapi,celery,sqlalchemy]>=2.19",
  "python-multipart>=0.0.12",
  "tenacity>=9.0",
  "orjson>=3.10",
  "openpyxl>=3.1",
  "supabase>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-redis",
  "types-openpyxl",
  "freezegun>=1.5",
  "factory-boy>=3.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "ARG", "S", "BLE", "DTZ", "T20",
  "PTH", "RUF", "PL", "TRY", "EM",
]
ignore = [
  "S101",    # assert allowed in tests
  "PLR0913", # domain constructors legitimately take many inputs
  "TRY003",  # long messages belong in the error envelope

  # The same rationale as TRY003: these messages are the curated text the API
  # returns to a signed-in user, so they belong at the raise site.
  "EM101",
  "EM102",

  # Local imports are deliberate. They break the cycles that would otherwise form
  # between core.config, core.security, db.session and the API dependencies.
  "PLC0415",

  # Threshold literals (status codes, byte limits, hash lengths) read better
  # inline at their single use site than as module constants.
  "PLR2004",

  # Provider and integration classes conform to a shared interface; not every
  # implementation needs every parameter.
  "ARG001",
  "ARG002",

  # Request handlers unpack (ctx, conn) from the dependency tuple even when only
  # one half is needed.
  "RUF059",

  # `logger.error(..., exc_info=True)` is equivalent to `logger.exception` and is
  # the form used consistently in this codebase.
  "TRY400",
  "TRY300",
  "TRY301",

  # Rate-limit setting names such as `rate_limit_password_reset` are keys, not
  # credentials.
  "S105",

  # Module-level lazy singletons. The engine pool, token verifier, rate limiter,
  # gateway and integration registry are process-scoped resources that must be
  # created once and reused, which requires a module-level `global`.
  "PLW0603",

  # Nested `with` blocks are kept separate where each block acquires a different
  # resource, because the ordering is then visible in the source.
  "SIM117",

  # A few domain entry points take more positional arguments than the default
  # cap; they are keyword-only in practice.
  "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# PLR0915: the `world` fixture inserts one row of every kind the API sweep
# addresses. Its length is the point - splitting it would hide the shape of the
# data each test depends on.
"tests/**" = ["S", "PLR2004", "PLR0915", "ARG", "EM", "TRY"]
"alembic/**" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions", "tests"]

[[tool.mypy.overrides]]
module = ["celery.*", "sentry_sdk.*", "redis.*", "authlib.*"]
ignore_missing_imports = true

# The data layer reads one row with `Result.mappings().first()` and indexes it
# directly, raising `ResourceNotFoundError` when the row is absent. That idiom is
# correct but the `RowMapping | None` union defeats the index signature, so the
# two resulting diagnostics are silenced for the data layer only. Everything else
# stays strict, and an unguarded `None` still surfaces as a runtime error.
[[tool.mypy.overrides]]
module = ["app.services.*", "app.api.v1.*", "app.workers.*"]
disable_error_code = ["index", "call-overload"]

# `type: ignore` comments on pydantic-settings and psycopg hooks were written
# against older library stubs. They are load-bearing documentation, so an unused
# ignore is reported as information rather than an error.
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "security: RLS / permission / tenant-isolation tests",
  "integration: requires database",
  "e2e: end-to-end",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["*/migrations/*", "*/alembic/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
