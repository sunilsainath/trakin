# Alembic configuration for MyTrakin.
#
# The authoritative schema is supabase/migrations/*.sql. This file exists so
# `alembic check` can detect drift between the running database and the models,
# and so future schema changes can be applied through Alembic when appropriate.
#
#   alembic upgrade head              apply migrations
#   alembic downgrade -1              roll back one revision
#   alembic check                     fail if models have drifted
#   alembic revision --autogenerate   draft a revision
#
# The URL is read from the environment in alembic/env.py, not from here, so a
# credential is never committed.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S